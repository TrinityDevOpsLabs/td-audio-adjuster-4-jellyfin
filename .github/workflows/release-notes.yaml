name: Package release and update Jellyfin catalog

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to sync to the Jellyfin catalog
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    concurrency:
      group: package-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and attach the plugin ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          DOTNET_NOLOGO: 'true'
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must use vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi
          version=${RELEASE_TAG#v}
          asset="audioadjuster4jellyfin_${version}.zip"
          release="$RUNNER_TEMP/package-release.json"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            gh release view "$RELEASE_TAG" --json assets > "$release" 2>/dev/null || rm -f "$release"
          else
            gh release view "$RELEASE_TAG" --json assets > "$release"
          fi
          if [[ -f "$release" ]] && jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' "$release" > /dev/null; then
            exit 0
          fi

          dotnet build --configuration Release -p:Version="$version"
          archive="$RUNNER_TEMP/$asset"
          zip -j "$archive" bin/Release/net10.0/AudioAdjuster4Jellyfin.dll LICENSE NOTICE
          if [[ -f "$release" ]]; then
            gh release upload "$RELEASE_TAG" "$archive"
          else
            notes="$RUNNER_TEMP/release-notes.md"
            python3 .github/scripts/release_notes.py "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$notes"
            gh release create "$RELEASE_TAG" "$archive" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file "$notes"
          fi

  catalog:
    needs: package
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    concurrency:
      group: jellyfin-catalog
    steps:
      - name: Create catalog app token
        id: catalog-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.catalog-token.outputs.token }}
      - name: Update release notes and index the published ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${RELEASE_TAG#v}
          archive="audioadjuster4jellyfin_${version}.zip"
          release="$RUNNER_TEMP/release.json"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,publishedAt,body > "$release"
          if ! jq -e '.isDraft == false and .isPrerelease == false and .publishedAt != null' "$release" > /dev/null; then
            echo "::error::Publish a stable release before updating its notes and Jellyfin catalog entry."
            exit 1
          fi
          if ! gh release download "$RELEASE_TAG" --pattern "$archive" --dir "$RUNNER_TEMP"; then
            echo "::error::Could not download '$archive' from '$RELEASE_TAG'. Check the packaging job and the release assets."
            exit 1
          fi
          git show "refs/tags/$RELEASE_TAG:AudioAdjuster4Jellyfin.csproj" > "$RUNNER_TEMP/release.csproj"
          notes="$RUNNER_TEMP/release-notes.md"
          python3 .github/scripts/release_notes.py "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$notes"
          if ! cmp -s "$notes" <(jq -j '.body // ""' "$release"); then
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
            gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,publishedAt,body > "$release"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git branch --show-current)
          for attempt in 1 2 3; do
            git pull --rebase origin "$branch"
            python3 .github/scripts/update_manifest.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
              "$RUNNER_TEMP/release.csproj" "$RUNNER_TEMP/$archive" "$release"
            if git diff --quiet -- manifest.json; then
              exit 0
            fi
            git add manifest.json
            git commit -m "chore: index AudioAdjuster4Jellyfin $RELEASE_TAG"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            git reset --hard HEAD^
          done
          exit 1
