name: AudioAdjuster4Jellyfin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jellyfin: ['12.0.0', '12.4.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build plugin
        run: dotnet build --configuration Release -p:JellyfinVersion=${{ matrix.jellyfin }}
      - name: Check movie button script
        if: matrix.jellyfin == '12.0.0'
        run: node --check Configuration/movie-button.js
      - name: Upload plugin
        if: matrix.jellyfin == '12.0.0'
        uses: actions/upload-artifact@v4
        with:
          name: AudioAdjuster4Jellyfin
          path: |
            bin/Release/net10.0/AudioAdjuster4Jellyfin.dll
            LICENSE
            NOTICE
          if-no-files-found: error
