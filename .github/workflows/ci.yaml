name: AudioAdjuster4Jellyfin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build plugin
        run: dotnet build --configuration Release
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests and require 80% line coverage
        run: >-
          dotnet test tests/AudioAdjuster4Jellyfin.Tests.csproj --configuration Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:Include="[AudioAdjuster4Jellyfin]*"
          -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audio-adjuster-coverage
          path: tests/coverage.cobertura.xml
      - name: Check movie button script
        run: node --check Configuration/movie-button.js
      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: AudioAdjuster4Jellyfin
          path: |
            bin/Release/net10.0/AudioAdjuster4Jellyfin.dll
            LICENSE
            NOTICE
          if-no-files-found: error
